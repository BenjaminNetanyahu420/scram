<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>Scram</title>

	<link rel="icon" href="favicon.webp" />

	<script src="/scram/scramjet.all.js"></script>
	<script src="/baremux/index.js"></script>

	<link rel="stylesheet" href="index.css" />

	<script src="register-sw.js" defer></script>
	<script src="search.js" defer></script>
	<script src="index.js" defer></script>
</head>

<body>
	<div class="site-frame">

		<header class="site-header">
			<div class="brand">
				<div class="logo-wrapper">
					<img
            class="logo"
            src="sj.png"
            alt=""
            width="36"
            height="36"
          />

					<div class="brand-name">
						<h1>Scram</h1>
						<span>Web Utils</span>
					</div>
				</div>
			</div>
		</header>

		<main class="main-content">
			<div class="content">

				<section class="intro" aria-labelledby="page-title">
					<h2 id="page-title">Scram</h2>

					<p class="desc">
						Browse the web freely.
					</p>
				</section>

				<section class="launcher" aria-labelledby="launcher-label">

					<div class="launcher-head">
						<label
              id="launcher-label"
              class="launcher-label"
              for="sj-address"
            >
              Welcome!
            </label>

						<span class="launcher-hint">
              Enter a URL or search term
            </span>
					</div>

					<form id="sj-form" role="search">
						<input
              id="sj-search-engine"
              value="https://www.google.com/search?q=%s"
              type="hidden"
            />

						<div class="address-shell">

							<div class="address-prefix" aria-hidden="true">
								<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
									<circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.7" />

									<path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
								</svg>
							</div>

							<input
                id="sj-address"
                type="text"
                placeholder="Search or enter URL"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                enterkeyhint="go"
              />

							<button
                class="address-submit"
                type="submit"
                aria-label="Go"
                title="Go"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path
                    d="M5 12H19"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />

                  <path
                    d="M14 7L19 12L14 17"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>

						</div>
					</form>

					<div class="error-area" aria-live="polite" aria-atomic="false">
						<p id="sj-error"></p>
						<pre id="sj-error-code"></pre>
					</div>

				</section>

			</div>
		</main>

		<footer>
			<nav class="footer-links" aria-label="Project links">
				<a href="https://github.com/430L">
					GitHub
				</a>

				<a href="https://github.com/430L/Scram">
					Source Code
				</a>

				<a href="credits.html">
					License
				</a>
			</nav>

			<div class="footer-bottom">
				<span>Scram</span>
				<span class="footer-mark" aria-hidden="true"> • </span>
				<span>Made by Payson</span>
			</div>
		</footer>

	</div>
</body>

</html>
